services:
  - type: cron
    name: appmeup-refresh
    runtime: node
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
